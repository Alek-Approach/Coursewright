<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coursewright</title>
<meta name="description" content="Turn an ESL syllabus into a course plan and teaching materials.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5F9; --surface:#FFFFFF; --sunken:#EDF2F9; --ink:#14213A; --ink2:#4B5872; --ink3:#7A869E;
  --line:#DCE2ED; --line2:#C6CFDF; --accent:#143865; --on-accent:#FFFFFF; --gold:#D39F10; --gold-soft:#FBF3DC;
  --danger:#B3352B; --danger-soft:#FBEAE8; --ok:#2C7A57; --focus:#2F6FD0;
  --ui:'Libre Franklin',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --doc:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1526; --surface:#162038; --sunken:#1C2947; --ink:#E8EDF7; --ink2:#A6B1C8; --ink3:#7E8AA4;
    --line:#2A3654; --line2:#3A4867; --accent:#8DB2EA; --on-accent:#0E1526; --gold:#E0B23A; --gold-soft:#2E2A18;
    --danger:#F08A80; --danger-soft:#3A1F1F; --ok:#6CCB9A; --focus:#8DB2EA;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1526; --surface:#162038; --sunken:#1C2947; --ink:#E8EDF7; --ink2:#A6B1C8; --ink3:#7E8AA4;
  --line:#2A3654; --line2:#3A4867; --accent:#8DB2EA; --on-accent:#0E1526; --gold:#E0B23A; --gold-soft:#2E2A18;
  --danger:#F08A80; --danger-soft:#3A1F1F; --ok:#6CCB9A; --focus:#8DB2EA;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:19px}h3{font-size:16px}
p{margin:0}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;background:none;border:0;padding:4px 0;color:var(--ink)}
.brand .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.brand .mark svg{width:15px;height:15px}
.spacer{flex:1}
.top-in{flex-wrap:wrap}
@media(max-width:700px){.hide-sm{display:none}}
code{background:var(--sunken);padding:1px 5px;border-radius:4px;font-size:.92em}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
.narrow{max-width:740px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500;font-size:14px;line-height:1.2;min-height:38px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.field{display:grid;gap:6px;margin-bottom:18px}
.field>label,.lbl{font-weight:600;font-size:14px}
.hint{color:var(--ink2);font-size:13px}
.err{color:var(--danger);font-size:13px;font-weight:500}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;min-height:40px}
textarea{resize:vertical;min-height:92px;line-height:1.5}
input.bad,textarea.bad{border-color:var(--danger)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;font-size:14px;min-height:36px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-size:14px;font-weight:500;min-height:38px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;background:var(--sunken);flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--sunken);color:var(--ink2);border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:500;white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:var(--ink)}
.banner{border-radius:10px;padding:12px 14px;font-size:14px;background:var(--danger-soft);color:var(--ink);border:1px solid var(--danger);margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:var(--sunken);border-color:var(--line2)}

/* dashboard */
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{color:var(--ink2);max-width:52ch;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:left;display:grid;gap:14px;align-content:start;width:100%}
.course:hover{border-color:var(--line2);box-shadow:0 1px 8px rgba(20,33,58,.08)}
.course h3{font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.segbar{display:flex;gap:3px}
.segbar i{flex:1;height:7px;border-radius:2px;background:var(--line);min-width:3px}
.segbar i.on{background:var(--gold)}
.course-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink2);font-size:13px}
.empty{border:1.5px dashed var(--line2);border-radius:12px;padding:40px 20px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--ink2)}

/* stepper */
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:22px;font-size:13px;color:var(--ink3)}
.steps b{font-weight:600}
.steps .on{color:var(--ink);font-weight:600}
.steps .sep{width:16px;height:1px;background:var(--line2)}

/* analyze */
.proc{display:grid;gap:14px;margin-top:8px}
.proc-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.proc-row.done{color:var(--ink2)}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sunken);color:var(--ink3)}
.done .dot{background:var(--ok);color:#fff}
.now .dot{background:transparent}

/* workspace */
.ws-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.name-in{font-size:22px;font-weight:600;border:1px solid transparent;background:transparent;padding:4px 8px;margin-left:-8px;border-radius:8px;min-height:0;width:min(100%,640px);letter-spacing:-.01em}
.name-in:hover{border-color:var(--line)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.tabs button[disabled]{opacity:.5;cursor:not-allowed}

/* plan */
details.found{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
details.found summary{padding:14px 18px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.found summary::-webkit-details-marker{display:none}
details.found[open] summary svg.i{transform:rotate(90deg)}
.found-body{padding:0 18px 18px;display:grid;gap:14px;font-size:14px}
.found-body h4{font-size:13px;color:var(--ink2);margin-bottom:4px}
.found-body ul{margin:0;padding-left:18px}
.ai-box{display:grid;gap:10px;margin-bottom:22px}
.ai-box .ex{display:flex;gap:6px;flex-wrap:wrap}
.ai-box .ex button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2)}
.ai-box .ex button:hover{background:var(--sunken)}
.plan-list{display:grid;gap:12px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.wk-top{display:flex;gap:12px;align-items:flex-start}
.wk-n{flex:none;min-width:64px;font-weight:600;color:var(--ink2);font-size:13px;padding-top:3px}
.wk-main{flex:1;min-width:0;display:grid;gap:8px}
.wk-main h3{font-size:16px}
.wk ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink)}
.wk-actions{display:flex;gap:6px;flex-wrap:wrap}
.approve-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:22px;padding:16px 18px;background:var(--sunken);border-radius:12px}

/* materials */
.mat{display:grid;gap:22px}
@media(min-width:900px){.mat{grid-template-columns:230px minmax(0,1fr);align-items:start}.weeknav{position:sticky;top:calc(70px + env(safe-area-inset-top,0px));flex-direction:column;overflow:visible}.weeknav .wn{width:100%}}
.weeknav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.wn{flex:none;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;font-size:13.5px;min-height:38px}
.wn[aria-current=true]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--gold)}
.wn .st{width:9px;height:9px;border-radius:50%;background:var(--line2);flex:none}
.wn .st.ready{background:var(--gold)}
.wn .st.busy{background:none;border:2px solid var(--gold);border-right-color:transparent;animation:sp .8s linear infinite}
.wn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.gen-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.canvas{background:var(--sunken);border-radius:14px;padding:14px}
@media(min-width:700px){.canvas{padding:24px}}
.paper{background:var(--surface);color:var(--ink);border-radius:4px;box-shadow:0 1px 3px rgba(20,33,58,.12),0 6px 24px rgba(20,33,58,.06);padding:22px 18px;max-width:820px;margin:0 auto}
@media(min-width:700px){.paper{padding:44px 52px}}
.paper h2{font-family:var(--doc);font-size:26px;font-weight:700;letter-spacing:-.015em;margin-bottom:6px}
.paper .objs{font-family:var(--doc);color:var(--ink2);font-size:15px;margin:8px 0 0;padding-left:18px}
.blk{border-top:1px solid var(--line);padding:18px 0 4px;margin-top:20px;display:grid;gap:10px}
.blk-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk-h h3{font-family:var(--doc);font-size:19px;font-weight:600;flex:1 1 200px}
.doc-body{font-family:var(--doc);font-size:16.5px;line-height:1.65}
.doc-body p{margin:0 0 .8em}.doc-body ul,.doc-body ol{margin:0 0 .9em;padding-left:1.4em}.doc-body li{margin-bottom:.3em}
.doc-body h4{font-family:var(--ui);font-size:14px;margin:1em 0 .4em}
.doc-body table{border-collapse:collapse;margin:0 0 1em;max-width:100%;display:block;overflow-x:auto}
.doc-body th,.doc-body td{border:1px solid var(--line2);padding:6px 10px;text-align:left;font-size:15px}
.doc-body th{background:var(--sunken)}
.tnotes{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 14px;font-size:14px}
.tnotes .doc-body{font-family:var(--ui);font-size:14px;line-height:1.55}
.tnotes .lbl{font-size:12.5px;color:var(--ink2);display:block;margin-bottom:4px}
.blk-actions{display:flex;gap:4px;flex-wrap:wrap;padding-top:4px}
.vtabs{display:flex;gap:6px}
.edit-grid{display:grid;gap:10px}
.edit-grid textarea{min-height:150px;font-family:var(--ui);font-size:14px}
.inline-ask{display:flex;gap:8px;flex-wrap:wrap}
.inline-ask input{flex:1 1 220px}
.lockmsg{text-align:center;padding:40px 16px;display:grid;gap:12px;justify-items:center;color:var(--ink2)}

/* output */
.out-grid{display:grid;gap:18px}
@media(min-width:900px){.out-grid{grid-template-columns:320px minmax(0,1fr);align-items:start}}
.out-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doc-cover{text-align:center;padding:40px 0 60px}
.doc-cover h1{font-family:var(--doc);font-size:34px;margin-bottom:10px}
.doc-toc{font-family:var(--doc);text-align:left;max-width:420px;margin:26px auto 0;padding-left:20px}
.pg{page-break-before:always}
.pg:first-child{page-break-before:auto}
.dv-vlabel{font-family:var(--ui);font-size:12.5px;font-weight:600;color:var(--ink2);margin:10px 0 4px;display:block}
.tt{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:13px;margin:12px 0}
.tt th,.tt td{border:1px solid var(--line2);padding:5px 9px;text-align:left}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:50;max-width:min(92vw,460px);box-shadow:0 4px 20px rgba(0,0,0,.25)}

@media print{
  body{background:#fff}
  .noprint,.top{display:none!important}
  .wrap{padding:0;max-width:none}
  .canvas{background:none;padding:0}
  .paper{box-shadow:none;padding:0;max-width:none;color:#000}
  .doc-body,.doc-body *{color:#000}
}
@media(prefers-reduced-motion:reduce){.spin,.wn .st.busy{animation-duration:2.4s}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>

<script>
/* =====================================================================
   Coursewright: syllabus in, course materials out.
   Layers: STATE  ->  AI SERVICE (swappable)  ->  VIEWS
   ===================================================================== */

/* ---------- utils ---------- */
const h = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid = () => Math.random().toString(36).slice(2, 10);
const LEVELS = ['A1','A2','B1','B2','C1'];
const ICON = {
  plus:'M12 5v14M5 12h14', upload:'M12 16V4m0 0l-4 4m4-4l4 4M4 20h16',
  trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3', edit:'M4 20h4L19 9l-4-4L4 16v4z',
  refresh:'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5', check:'M5 12l5 5L20 7',
  up:'M12 19V5m0 0l-6 6m6-6l6 6', down:'M12 5v14m0 0l-6-6m6 6l6-6',
  expand:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5', shorten:'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5',
  sparkle:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z',
  layers:'M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5', print:'M7 9V3h10v6M7 17H4v-6h16v6h-3M7 14h10v7H7z',
  download:'M12 4v12m0 0l-4-4m4 4l4-4M4 20h16', eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  file:'M6 3h9l4 4v14H6zM14 3v5h5', chev:'M9 6l6 6-6 6', x:'M6 6l12 12M18 6L6 18',
  book:'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5zM19 19v2H6', stop:'M6 6h12v12H6z'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[n]||''}"/></svg>`;
const spinner = '<span class="spin" aria-hidden="true"></span>';

function md(src){
  const inline = s => h(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  const lines = String(src||'').split('\n'); let out='', list=null, para=[];
  const fP = () => { if(para.length){ out += '<p>'+para.map(inline).join('<br>')+'</p>'; para=[]; } };
  const fL = () => { if(list){ out += '</'+list+'>'; list=null; } };
  const isRow = l => /^\s*\|.*\|\s*$/.test(l);
  for(let i=0;i<lines.length;i++){
    const l = lines[i]; let m;
    if(isRow(l)){
      fP(); fL(); const rows=[];
      while(i<lines.length && isRow(lines[i])){ rows.push(lines[i]); i++; } i--;
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      const body = rows.filter(r => !/^\s*\|[\s:\-|]+\|\s*$/.test(r));
      out += '<table>'+body.map((r,ri)=>'<tr>'+cells(r).map(c=>(ri?'<td>':'<th>')+inline(c)+(ri?'</td>':'</th>')).join('')+'</tr>').join('')+'</table>';
    }
    else if((m=l.match(/^#{1,4}\s+(.*)/))){ fP(); fL(); out += '<h4>'+inline(m[1])+'</h4>'; }
    else if((m=l.match(/^\s*[-*\u2022]\s+(.*)/))){ fP(); if(list!=='ul'){ fL(); out+='<ul>'; list='ul'; } out += '<li>'+inline(m[1])+'</li>'; }
    else if((m=l.match(/^\s*(\d+)[.)]\s+(.*)/))){ fP(); if(list!=='ol'){ fL(); out+='<ol start="'+m[1]+'">'; list='ol'; } out += '<li>'+inline(m[2])+'</li>'; }
    else if(!l.trim()){ fP(); fL(); }
    else { fL(); para.push(l); }
  }
  fP(); fL(); return out;
}
function ago(ts){
  const s = Math.max(1, Math.round((Date.now()-ts)/1000));
  if(s<60) return 'Just now'; const m=Math.round(s/60); if(m<60) return m+' min ago';
  const hr=Math.round(m/60); if(hr<24) return hr+(hr===1?' hour ago':' hours ago');
  const d=Math.round(hr/24); if(d<30) return d+(d===1?' day ago':' days ago');
  return new Date(ts).toLocaleDateString();
}
function setPath(obj, path, val){
  const p = path.split('.'); let o = obj;
  for(let i=0;i<p.length-1;i++){ if(o[p[i]]==null||typeof o[p[i]]!=='object') o[p[i]]={}; o=o[p[i]]; }
  o[p[p.length-1]] = val;
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, 3600);
}

/* ---------- state ---------- */
const LS_KEY = 'coursewright-v1';
const newDraft = () => ({ text:'', fileName:'', level:'', from:'A2', to:'B1', weeks:'', perWeek:'', len:'', lenUnit:'min', students:'', english:'none', extra:'', errors:{}, reading:false });
const S = { route:{view:'dashboard'}, courses:[], draft:newDraft(), busy:{}, ui:{ notes:true, variant:{}, ask:{}, blockInstr:{}, regen:{}, edit:null, blockEdit:null, error:'' }, analysis:null, genAll:null, out:{ audience:'student', scope:'week', week:0, preview:false } };

function loadState(){
  try{ const r = localStorage.getItem(LS_KEY); if(r){ const v = JSON.parse(r); if(Array.isArray(v)) S.courses = v; } }catch(e){}
  try{ S.deleted = JSON.parse(localStorage.getItem('coursewright-deleted')) || {}; }catch(e){ S.deleted = {}; }
  S.courses.forEach(c => { if(c.plan && c.plan.weeks) c.plan.weeks.forEach(w => { w.title = stripWk(w.title) || w.title; }); });
}
function localSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S.courses)); localStorage.setItem('coursewright-deleted', JSON.stringify(S.deleted||{})); }catch(e){} }
function persist(){ localSave(); }
const cur = () => S.courses.find(c => c.id === S.route.id);
const touch = c => { c.updatedAt = Date.now(); persist(); };
const hasUnit = (c, wid) => !!(c.units[wid] && c.units[wid].blocks && c.units[wid].blocks.length);
const genCount = c => c.plan ? c.plan.weeks.filter(w => hasUnit(c, w.id)).length : 0;
function levelLabel(c){ const l = c.settings.level; return l.mode==='mixed' ? `${l.from}\u2013${l.to} (mixed)` : l.level; }
const isMixed = c => c.settings.level.mode==='mixed';
function statusOf(c){
  if(!c.plan) return 'Analysis not finished';
  const n = genCount(c), N = c.plan.weeks.length;
  if(!c.planApproved) return 'Plan ready for review';
  return n ? `${n} of ${N} weeks generated` : 'Plan approved, nothing generated yet';
}
function go(view, extra){
  S.route = Object.assign({view}, extra||{});
  S.ui.edit = null; S.ui.blockEdit = null; S.ui.error = '';
  render(); window.scrollTo(0,0);
}

/* =====================================================================
   AI SERVICE
   Every function below builds a prompt from the syllabus + settings +
   approved plan + earlier material, and returns parsed JSON. To swap the
   backend (e.g. a server calling the Claude API), replace only callModel().
   ===================================================================== */
const AI = (() => {
  const PREFACE = `You are the curriculum engine inside a workspace for ESL teachers. The teacher's syllabus is the primary source of truth: never invent requirements it does not support, and never force a fixed lesson template. Choose activity types that fit this syllabus, its skills, the CEFR level, the time available and the teacher's instructions. Write natural, level-appropriate English, and write original texts and exercises rather than copying published material. Respond with a single JSON value and nothing else: no prose, no code fences.`;

  const CFG_KEY = 'coursewright-ai';
  const getCfg = () => { try{ return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; }catch(e){ return {}; } };
  async function callModel(prompt, opts){
    opts = opts || {};
    // 1) Inside Claude: use the built-in sampling capability.
    const sample = (window.claude && claude.use) ? await claude.use('sample') : null;
    if(sample) return sample.json(PREFACE + '\n\n' + prompt, { modelTier: opts.tier || 'default', cache:false, signal: opts.signal });
    // 2) Standalone (e.g. GitHub Pages): call the Claude API with a key the teacher pastes in AI settings.
    //    For a shared deployment, point `endpoint` at your own server-side proxy instead so no key sits in the browser.
    const cfg = getCfg();
    if(!cfg.key && !cfg.endpoint) throw { code:'nokey', message:'Add your Claude API key in AI settings to use the AI features.' };
    const url = cfg.endpoint || 'https://api.anthropic.com/v1/messages';
    const headers = { 'content-type':'application/json' };
    if(!cfg.endpoint){ headers['x-api-key'] = cfg.key; headers['anthropic-version'] = '2023-06-01'; headers['anthropic-dangerous-direct-browser-access'] = 'true'; }
    const res = await fetch(url, { method:'POST', headers, signal: opts.signal,
      body: JSON.stringify({ model: cfg.model || 'claude-sonnet-5-5', max_tokens: 16000, messages:[{ role:'user', content: PREFACE + '\n\n' + prompt }] }) });
    if(!res.ok){
      let m = ''; try{ m = (await res.json()).error.message; }catch(e){}
      throw { code: res.status===429 ? 'rate_limited' : 'http', message: res.status===401 ? 'The API key was rejected. Check it in AI settings.' : (m || 'The AI request failed ('+res.status+').') };
    }
    const data = await res.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    if(data.stop_reason==='max_tokens') throw { code:'invalid_json', truncated:true };
    const v = parseModelJson(text);
    if(v === undefined) throw { code:'invalid_json' };
    return v;
  }

  // Models often wrap JSON in prose or code fences, or put raw line breaks inside
  // long Markdown strings (invalid JSON). Recover the JSON value instead of failing.
  function parseModelJson(text){
    const tryParse = t => { try{ return JSON.parse(t); }catch(e){ return undefined; } };
    let t = String(text||'').trim();
    const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
    const cands = [t]; if(fence) cands.push(fence[1].trim());
    const a = t.search(/[{[]/), z = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
    if(a >= 0 && z > a) cands.push(t.slice(a, z+1));
    for(const c of cands){ const v = tryParse(c); if(v !== undefined) return v; }
    for(const c of cands){ const v = tryParse(repairJson(c)); if(v !== undefined) return v; }
    return undefined;
  }
  function repairJson(t){
    let out = '', inStr = false, esc = false;
    for(const ch of t){
      if(inStr){
        if(esc){ esc = false; out += ch; continue; }
        if(ch === '\\'){ esc = true; out += ch; continue; }
        if(ch === '"'){ inStr = false; out += ch; continue; }
        if(ch === '\n'){ out += '\\n'; continue; }
        if(ch === '\r'){ out += '\\r'; continue; }
        if(ch === '\t'){ out += '\\t'; continue; }
        if(ch < ' '){ out += '\\u' + ch.charCodeAt(0).toString(16).padStart(4,'0'); continue; }
        out += ch;
      } else {
        if(ch === '"') inStr = true;
        out += ch;
      }
    }
    return out.replace(/,(\s*[}\]])/g, '$1');
  }

  function settingsText(c){
    const s = c.settings;
    return [
      `Level: ${levelLabel(c)}`,
      `Duration: ${s.weeks} weeks`,
      `Classes per week: ${s.perWeek}`,
      `Length of each class: ${s.classMinutes} minutes`,
      `Instructional time per week: ${s.perWeek * s.classMinutes} minutes`,
      s.students ? `Approximate class size: ${s.students} students` : 'Class size: not specified',
      `English variety: ${s.english==='us'?'American English':s.english==='uk'?'British English':'no preference'}`,
      `Teacher instructions: ${s.extra || '(none)'}`
    ].join('\n');
  }
  const syllabusText = c => 'SYLLABUS (source of truth):\n"""\n' + c.syllabus.slice(0, 14000) + '\n"""';
  const analysisText = c => c.analysis ? 'SYLLABUS ANALYSIS:\n' + JSON.stringify(c.analysis) : '';
  const planText = c => c.plan ? 'APPROVED COURSE PLAN:\n' + JSON.stringify(c.plan.weeks.map((w,i)=>({week:i+1,title:w.title,topic:w.topic,objectives:w.objectives,activityTypes:w.activityTypes,minutes:w.minutes}))) : '';
  function previousText(c, idx){
    const parts = [];
    for(let i=0;i<idx;i++){
      const w = c.plan.weeks[i], u = c.units[w.id];
      if(u && u.blocks && u.blocks.length) parts.push(`Week ${i+1} "${w.title}": ` + u.blocks.map(b => `${b.title} [${b.kind}]: ${(b.student||'').replace(/\s+/g,' ').slice(0,110)}`).join(' | '));
    }
    const t = parts.join('\n'); return t ? 'PREVIOUSLY GENERATED MATERIAL (stay consistent, recycle language, do not repeat):\n' + t.slice(-3500) : '';
  }
  const ctx = (c, o) => [syllabusText(c), 'COURSE SETTINGS:\n'+settingsText(c), (o&&o.analysis!==false)?analysisText(c):'', (o&&o.plan)?planText(c):''].filter(Boolean).join('\n\n');

  const WEEK_SHAPE = `{"title": string, "topic": string, "objectives": string[] (2-4 concrete, teachable objectives), "activityTypes": string[] (3-6 material or activity types chosen for this week, free wording), "minutes": number, "syllabusBasis": string (short note on which part of the syllabus this comes from)}`;
  const BLOCK_SHAPE = `{"kind": string (short free-form label such as "Warm-up", "Reading", "Grammar practice", "Role play"), "title": string, "minutes": number, "student": string (Markdown, exactly what students see: instructions, texts, exercises. NEVER include answers), "teacher": string (Markdown: procedure, grouping and timing tips, materials, full answer key)}`;

  return {
    async analyzeSyllabus(c, o){
      return callModel(`${syllabusText(c)}\n\nCOURSE SETTINGS:\n${settingsText(c)}\n\nAnalyze the syllabus. Return JSON of this shape (use [] or "" when the syllabus does not state something; do not invent):\n{"courseTitle": string, "courseType": string (short label, your own words), "description": string, "objectives": string[], "skills": string[], "topics": string[], "outcomes": string[], "organization": string (how the syllabus organizes the course), "languageAreas": string[] (grammar or language areas, when relevant), "assessments": string[], "weeklyTopics": [{"label": string, "topic": string}], "gaps": string[] (things worth the teacher's attention, such as a mismatch between the syllabus units and the number of weeks)}`, o);
    },
    async generateCoursePlan(c, o){
      return callModel(`${ctx(c)}\n\nDraft a course material plan that reflects this syllabus. Return exactly ${c.settings.weeks} week entries, in order (fold holidays, reviews or combined units into the plan as the syllabus suggests). Do not use one identical structure for every week: pick activity types that fit each week's aim.\nReturn JSON: {"weeks": [ ${WEEK_SHAPE} ]}. Each "minutes" should equal ${c.settings.perWeek * c.settings.classMinutes} unless the syllabus says otherwise.`, o);
    },
    async reviseCoursePlan(c, instruction, o){
      return callModel(`${ctx(c)}\n\nCURRENT PLAN (may include the teacher's manual edits; keep unchanged weeks as they are):\n${JSON.stringify(c.plan.weeks.map(({id,...w})=>w))}\n\nTEACHER REQUEST: ${instruction}\n\nRevise the plan. Return the FULL plan with the same number of weeks (${c.plan.weeks.length}) unless the request says otherwise.\nReturn JSON: {"weeks": [ ${WEEK_SHAPE} ]}`, o);
    },
    async regenerateWeek(c, idx, instruction, o){
      const w = c.plan.weeks[idx];
      return callModel(`${ctx(c)}\n\nFULL PLAN FOR CONTEXT:\n${JSON.stringify(c.plan.weeks.map((x,i)=>({week:i+1,title:x.title,topic:x.topic})))}\n\nRewrite ONLY week ${idx+1}. Its current version: ${JSON.stringify({title:w.title,topic:w.topic,objectives:w.objectives,activityTypes:w.activityTypes})}\n${instruction ? 'TEACHER REQUEST: '+instruction : 'Offer a fresh take that still fits the syllabus.'}\nReturn JSON: ${WEEK_SHAPE}`, o);
    },
    async generateUnit(c, idx, opts){
      opts = opts || {}; const w = c.plan.weeks[idx];
      const base = `${ctx(c,{plan:true})}\n\n${previousText(c, idx)}\n\nWEEK ${idx+1}: ${JSON.stringify({title:w.title,topic:w.topic,objectives:w.objectives,suggestedActivityTypes:w.activityTypes,minutes:w.minutes})}.\n${opts.instruction ? 'TEACHER REQUEST FOR THIS WEEK: '+opts.instruction+'\n' : ''}Plan for about ${c.settings.students || 'a typical number of'} students (pairs/groups where useful). Student text must be clean and answer-free; answer keys go in the teacher field. Include full reading or listening scripts when an activity needs them.`;
      const co = { tier:'default', signal: opts.signal };
      const single = async () => callModel(`${base}\nChoose the sections this week actually needs (4-8) and total their minutes close to ${w.minutes}; there is no required section list. Keep every section compact but ready to use (the whole week under about 2000 words).\nReturn JSON: {"blocks": [ ${BLOCK_SHAPE} ]}`, co);
      // Long weeks are written one section at a time, so no single response can be cut off.
      const staged = async () => {
        const outlinePrompt = `${base}\nPlan this week as an OUTLINE ONLY (no full content yet). 4-8 sections, minutes totalling about ${w.minutes}, no required section list.\nReturn JSON: {"sections": [ {"kind": string, "title": string, "minutes": number, "brief": string (one sentence: what students do and the language focus)} ]}`;
        let out;
        try{ out = await callModel(outlinePrompt, co); }
        catch(e){ if(!e || e.code !== 'invalid_json') throw e; out = await callModel(outlinePrompt, co); }
        const secs = (out && out.sections) || (Array.isArray(out) ? out : []);
        if(!secs.length) throw { code:'invalid_json' };
        const blocks = [];
        for(let k = 0; k < secs.length; k++){
          if(opts.onProgress) opts.onProgress(`Writing section ${k+1} of ${secs.length}: ${secs[k].title || ''}`);
          let blk = null;
          for(let attempt = 0; attempt < 2 && !blk; attempt++){
            try{
              blk = await callModel(`${base}\nOUTLINE OF THE WEEK: ${JSON.stringify(secs)}\nALREADY WRITTEN: ${blocks.map(b => b.title).join('; ') || '(nothing yet)'}\nWrite ONLY section ${k+1}: ${JSON.stringify(secs[k])}. Keep it compact but ready to use, and consistent with the other sections.\nReturn JSON: ${BLOCK_SHAPE}`, co);
            }catch(e){ if(!e || e.code !== 'invalid_json' || attempt) throw e; }
          }
          blocks.push(blk);
        }
        return { blocks };
      };
      if(w.minutes > 100) return staged();
      try{ return await single(); }
      catch(e){ if(e && e.code === 'invalid_json'){ if(opts.onProgress) opts.onProgress('Writing this week in smaller parts\u2026'); return staged(); } throw e; }
    },
    async reviseActivity(c, idx, block, action, instruction, o){
      const how = {
        regenerate:'Write a fresh alternative activity with the same purpose and time.',
        easier:'Make it easier: simpler language, more scaffolding, models or word banks, fewer items.',
        harder:'Make it more challenging: less support, higher-level language, extension or open-ended tasks.',
        expand:'Expand it: more practice items, more depth or a follow-up task.',
        shorten:'Shorten it: keep the essential core and cut the time accordingly.',
        modify:'Apply the teacher request below.'
      }[action];
      const w = c.plan.weeks[idx];
      return callModel(`${ctx(c,{plan:false})}\n\nThis activity is from Week ${idx+1} "${w.title}" (objectives: ${(w.objectives||[]).join('; ')}).\nCURRENT ACTIVITY:\n${JSON.stringify({kind:block.kind,title:block.title,minutes:block.minutes,student:block.student,teacher:block.teacher})}\n\nTASK: ${how}${instruction ? '\nTEACHER REQUEST: '+instruction : ''}\nKeep the answer key in the teacher field and out of the student field.\nReturn JSON: ${BLOCK_SHAPE}`, o);
    },
    async differentiateActivity(c, idx, block, o){
      return callModel(`${ctx(c,{plan:false})}\n\nThis is a mixed-level class (${levelLabel(c)}). CORE ACTIVITY:\n${JSON.stringify({kind:block.kind,title:block.title,minutes:block.minutes,student:block.student,teacher:block.teacher})}\n\nProduce an easier version (for the lower end of the range) and a more challenging version (for the upper end) of the SAME activity so both can run in the same lesson. Keep answer keys in the teacher fields.\nReturn JSON: {"easier": {"student": string, "teacher": string}, "harder": {"student": string, "teacher": string}}`, o);
    },

    /* Versions are compiled from stored sections. These are deterministic today
       and can be swapped for model calls (e.g. to reformat for print) later. */
    generateStudentVersion(c, idx){ return unitDoc(c, idx, false); },
    generateTeacherVersion(c, idx){ return unitDoc(c, idx, true); }
  };
})();

/* ---------- normalizers ---------- */
const arr = v => Array.isArray(v) ? v.map(String).filter(Boolean) : (v ? [String(v)] : []);
const stripWk = t => String(t||'').replace(/^\s*(week|unit)\s*\d+\s*[:\-\u2013\u2014.]\s*/i,'').trim();
function normWeek(w, fallbackMin){
  w = w || {};
  return { id: w.id || uid(), title: stripWk(w.title) || 'Untitled week', topic: String(w.topic||''), objectives: arr(w.objectives), activityTypes: arr(w.activityTypes), minutes: Number(w.minutes) || fallbackMin || 0, basis: String(w.syllabusBasis||w.basis||'') };
}
function normPlan(p, c){
  const list = Array.isArray(p) ? p : (p && p.weeks) || [];
  if(!list.length) throw { message:'The plan came back empty. Try again.' };
  const fm = c.settings.perWeek * c.settings.classMinutes;
  return list.map(w => normWeek(w, fm));
}
function normBlock(b, keepId){
  b = b || {};
  return { id: keepId || uid(), kind: String(b.kind||'Activity'), title: String(b.title||'Untitled section'), minutes: Number(b.minutes)||0, student: String(b.student||''), teacher: String(b.teacher||''), variants: null };
}
function errMsg(e){
  if(!e) return 'Something went wrong.';
  if(e.code==='not_granted') return 'Access to Claude was declined. Allow it to continue.';
  if(e.code==='rate_limited') return 'Too many requests. Wait a moment, then try again.';
  if(e.code==='invalid_json') return e.truncated ? 'The response was cut off before it finished. Try again, or narrow the request.' : 'The AI response could not be read. Try again.';
  if(e.code==='cancelled') return 'Cancelled.';
  if(e.code==='nokey') return 'Add your Claude API key under AI settings (top right) to use the AI features.';
  return e.message || 'Something went wrong.';
}

/* =====================================================================
   OUTPUT DOCUMENT COMPILERS
   ===================================================================== */
function unitDoc(c, idx, teacher){
  const w = c.plan.weeks[idx], u = c.units[w.id];
  if(!u || !u.blocks.length) return `<section class="pg"><h2>Week ${idx+1}: ${h(w.title)}</h2><p class="hint">No material generated for this week yet.</p></section>`;
  let html = `<section class="pg"><h2>Week ${idx+1}: ${h(w.title)}</h2>`;
  if(teacher){
    if(w.objectives.length) html += `<ul class="objs">${w.objectives.map(o=>`<li>${h(o)}</li>`).join('')}</ul>`;
    html += `<table class="tt"><tr><th>Section</th><th>Type</th><th>Minutes</th></tr>${u.blocks.map(b=>`<tr><td>${h(b.title)}</td><td>${h(b.kind)}</td><td>${b.minutes||''}</td></tr>`).join('')}<tr><th colspan="2">Total</th><th>${u.blocks.reduce((a,b)=>a+(b.minutes||0),0)}</th></tr></table>`;
  }
  u.blocks.forEach(b => {
    html += `<div class="blk"><div class="blk-h"><h3>${h(b.title)}</h3>${teacher?`<span class="tag">${h(b.kind)}${b.minutes?', '+b.minutes+' min':''}</span>`:''}</div><div class="doc-body">${md(b.student)}</div>`;
    if(teacher && b.teacher) html += `<div class="tnotes"><span class="lbl">Teacher notes and answers</span><div class="doc-body">${md(b.teacher)}</div></div>`;
    if(b.variants){
      [['easier','Support version'],['harder','Challenge version']].forEach(([k,label]) => {
        const v = b.variants[k]; if(!v) return;
        html += `<span class="dv-vlabel">${label}</span><div class="doc-body">${md(v.student)}</div>`;
        if(teacher && v.teacher) html += `<div class="tnotes"><span class="lbl">Teacher notes and answers (${label.toLowerCase()})</span><div class="doc-body">${md(v.teacher)}</div></div>`;
      });
    }
    html += '</div>';
  });
  return html + '</section>';
}
function compileOutput(c){
  const teacher = S.out.audience === 'teacher';
  const fn = i => teacher ? AI.generateTeacherVersion(c, i) : AI.generateStudentVersion(c, i);
  if(S.out.scope === 'week') return fn(Math.min(S.out.week, c.plan.weeks.length-1));
  const weeks = c.plan.weeks.map((w,i)=>i).filter(i => hasUnit(c, c.plan.weeks[i].id));
  if(!weeks.length) return '';
  let cover = '';
  if(S.out.scope === 'workbook'){
    cover = `<section class="pg doc-cover"><h1>${h(c.name)}</h1><p class="hint">${teacher?'Teacher edition':'Student workbook'}, level ${h(levelLabel(c))}</p><ol class="doc-toc">${weeks.map(i=>`<li>${h(c.plan.weeks[i].title)}</li>`).join('')}</ol></section>`;
  }
  return cover + weeks.map(fn).join('');
}
function docStandalone(c, body){
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${h(c.name)}</title><style>body{font-family:Georgia,serif;max-width:780px;margin:32px auto;padding:0 20px;line-height:1.6;color:#111}h2{font-size:26px}h3{font-size:19px}.blk{border-top:1px solid #ccc;margin-top:20px;padding-top:12px}.tnotes{background:#fbf3dc;border-left:3px solid #d39f10;padding:8px 14px;font-family:sans-serif;font-size:14px}.tag{font:12px sans-serif;background:#eee;padding:2px 6px}table{border-collapse:collapse}td,th{border:1px solid #bbb;padding:4px 8px}.pg{page-break-before:always}.pg:first-child{page-break-before:auto}.lbl,.dv-vlabel{font:600 12px sans-serif;display:block}</style></head><body>${body}</body></html>`;
}

/* PDF-BUILDER-START */
async function buildFillablePdf(PDFLib, doc){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdf = await PDFDocument.create();
  const font = await pdf.embedFont(StandardFonts.Helvetica);
  const bold = await pdf.embedFont(StandardFonts.HelveticaBold);
  const form = pdf.getForm();
  const W = 612, H = 792, M = 54, BOT = 64, CW = W - 2*M;
  const INK = rgb(0.08,0.13,0.23), BORDER = rgb(0.55,0.62,0.75), FILL = rgb(0.93,0.95,1);
  let page, y, n = 0, hadField = false;
  const newPage = () => { page = pdf.addPage([W,H]); y = H - M; };
  const need = hgt => { if(y - hgt < BOT) newPage(); };
  const clean = s => {
    s = String(s||'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1$2').replace(/`/g,'')
      .replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/\u00A0/g,' ');
    return Array.from(s).map(ch => { try{ font.encodeText(ch); return ch; }catch(e){ return '?'; } }).join('');
  };
  const tokenize = s => { const out = []; s.split(/(_{3,})/).forEach(p => { if(/^_{3,}$/.test(p)) out.push({blank:p.length}); else p.split(/\s+/).filter(Boolean).forEach(w => out.push({w})); }); return out; };
  const blankW = t => Math.min(170, Math.max(60, t.blank * 5.5));
  function layout(tokens, size, maxW, f){
    const sp = f.widthOfTextAtSize(' ', size), lines = [[]]; let x = 0;
    tokens.forEach(t => {
      const w = t.blank ? blankW(t) : f.widthOfTextAtSize(t.w, size);
      if(x > 0 && x + w > maxW){ lines.push([]); x = 0; }
      lines[lines.length-1].push({t, x, w}); x += w + sp;
    });
    return lines;
  }
  function addText(x, yy, w, hh, multi){
    const tf = form.createTextField('t' + (++n)); if(multi) tf.enableMultiline();
    tf.addToPage(page, { x, y:yy, width:w, height:hh, borderWidth:0.8, borderColor:BORDER, backgroundColor:FILL });
    tf.setFontSize(multi ? 11 : 10); hadField = true; return tf;
  }
  // Flow rich text (words + inline blanks). opts: size, indent, label, font, onFirst(baselineY)
  function flow(str, o){
    o = o || {}; const size = o.size || 11, f = o.font || font, indent = o.indent || 0, x0 = M + indent, lh = size * 1.5;
    const lines = layout(tokenize(clean(str)), size, CW - indent, f);
    lines.forEach((ln, li) => {
      need(lh + 4); y -= lh; const base = y + lh * 0.28;
      if(li === 0 && o.label) page.drawText(o.label, { x: x0 - 16, y: base, size, font: f, color: INK });
      if(li === 0 && o.onFirst) o.onFirst(base);
      ln.forEach(it => {
        if(it.t.blank) addText(x0 + it.x, base - 4, it.w, size + 7, false);
        else page.drawText(it.t.w, { x: x0 + it.x, y: base, size, font: f, color: INK });
      });
    });
    y -= (o.after == null ? 3 : o.after);
  }
  function answerField(lines, indent){
    const hh = lines * 17 + 7; need(hh + 8); y -= hh; addText(M + (indent||0), y, CW - (indent||0), hh, lines > 1); y -= 7;
  }
  function radios(options, indent){
    const rg = form.createRadioGroup('q' + (++n)); hadField = true; const used = {};
    options.forEach((op, k) => {
      let key = String(op.key).toLowerCase().replace(/[^a-z0-9]/g,'') || ('o' + k); while(used[key]) key += 'x'; used[key] = 1;
      flow(op.text, { indent: (indent||0) + 18, after: 1, onFirst: base => rg.addOptionToPage(key, page, { x: M + (indent||0), y: base - 2, width: 11, height: 11, borderWidth: 0.8, borderColor: BORDER, backgroundColor: FILL }) });
    });
    y -= 4;
  }
  const optRe = /^\s*(?:[-*]\s+)?\(?([a-hA-H])[.)]\s+(.*)$/;
  const rowRe = /^\s*\|.*\|\s*$/;
  const ansRe = /(\?\s*$)|\b(write|rewrite|complete|correct|answer|explain|describe|list|name|translate|change|make|give|say)\b/i;
  const longRe = /\b(write|explain|describe|why|sentences?|paragraph|opinion|discuss)\b/i;
  function renderMd(src){
    const L = String(src||'').replace(/\r/g,'').split('\n'); let i = 0, afterItem = false;
    while(i < L.length){
      const l = L[i];
      if(!l.trim()){ y -= 3; i++; continue; }
      if(rowRe.test(l)){
        const rows = []; while(i < L.length && rowRe.test(L[i])){ rows.push(L[i]); i++; }
        rows.filter(r => !/^\s*\|[\s:\-|]+\|\s*$/.test(r)).forEach((r, ri) => flow(r.trim().replace(/^\||\|$/g,'').split('|').map(x => x.trim()).join('   |   '), { size:10, font: ri ? font : bold, after:1 }));
        y -= 4; afterItem = false; continue;
      }
      let m;
      if((m = l.match(/^#{1,4}\s+(.*)/))){ y -= 4; flow(m[1], { size:12, font:bold }); i++; afterItem = false; continue; }
      if(optRe.test(l)){
        const opts = []; while(i < L.length && optRe.test(L[i])){ const q = L[i].match(optRe); opts.push({ key:q[1], text: q[1].toLowerCase() + ') ' + q[2] }); i++; }
        radios(opts, afterItem ? 22 : 4); afterItem = false; continue;
      }
      if((m = l.match(/^\s*(\d+)[.)]\s+(.*)/))){
        const text = m[2]; flow(text, { indent:22, label: m[1] + '.', after:2 }); i++;
        let j = i; while(j < L.length && !L[j].trim()) j++;
        const nextIsOpts = j < L.length && optRe.test(L[j]);
        if(/_{3,}/.test(text) || nextIsOpts){ afterItem = true; }
        else if(/\b(true or false|true\/false|T\/F)\b/i.test(text)){ radios([{key:'true',text:'True'},{key:'false',text:'False'}], 22); afterItem = false; }
        else if(ansRe.test(text) && text.length < 500){ answerField(longRe.test(text) ? 3 : 1, 22); afterItem = false; }
        else afterItem = false;
        continue;
      }
      if((m = l.match(/^\s*[-*\u2022]\s+(.*)/))){ flow(m[1], { indent:22, label:'\u2022', after:2 }); i++; afterItem = false; continue; }
      const para = [l]; i++;
      while(i < L.length && L[i].trim() && !rowRe.test(L[i]) && !optRe.test(L[i]) && !/^\s*(\d+[.)]|[-*\u2022]|#)/.test(L[i])){ para.push(L[i]); i++; }
      flow(para.join(' '), { after:4 }); afterItem = false;
    }
  }
  function nameDate(){
    need(30); y -= 22; const base = y + 6;
    page.drawText('Name', { x:M, y:base, size:10, font:bold, color:INK }); addText(M + 34, y, 190, 18, false);
    page.drawText('Date', { x:M + 250, y:base, size:10, font:bold, color:INK }); addText(M + 282, y, 110, 18, false); y -= 12;
  }
  if(doc.cover){
    newPage(); y = H - 230;
    flow(doc.title, { size:26, font:bold, after:8 }); flow(doc.subtitle || '', { size:12, after:18 });
    doc.weeks.forEach(w => flow(w.heading, { size:11, indent:0, after:2 }));
  }
  doc.weeks.forEach(w => {
    newPage(); flow(w.heading, { size:19, font:bold, after:2 }); nameDate(); y -= 6;
    w.blocks.forEach(b => {
      need(70); y -= 6; page.drawLine({ start:{x:M,y}, end:{x:W-M,y}, thickness:0.6, color:rgb(0.8,0.83,0.9) }); y -= 4;
      flow(b.title, { size:13, font:bold, after:4 }); hadField = false;
      renderMd(b.student);
      if(b.variants) [['easier','Support version'],['harder','Challenge version']].forEach(([k,lbl]) => { const v = b.variants[k]; if(v && v.student){ y -= 4; flow(lbl, { size:10, font:bold, after:3 }); renderMd(v.student); } });
      if(!hadField && /writ|reflect|journal|homework/i.test((b.kind||'') + ' ' + b.title)){ need(7*17+7+34); y -= 4; flow('Your response', { size:10, font:bold, after:3 }); answerField(7, 0); }
      y -= 8;
    });
  });
  const pages = pdf.getPages();
  pages.forEach((p, k) => p.drawText(`${doc.title}   |   Page ${k+1} of ${pages.length}`, { x:M, y:32, size:8, font, color:rgb(0.45,0.5,0.6) }));
  return pdf.save();
}

async function loadScript(url){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = url; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); });
}
async function readFile(file){
  const d = S.draft; d.reading = true; d.errors.file = ''; render();
  try{
    const name = file.name.toLowerCase(); let text = '';
    if(name.endsWith('.txt') || name.endsWith('.md')) text = await file.text();
    else if(name.endsWith('.docx')){
      if(!window.mammoth) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      text = (await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()})).value;
    } else if(name.endsWith('.pdf')){
      if(!window.pdfjsLib) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
      for(let p=1;p<=pdf.numPages;p++){ const tc = await (await pdf.getPage(p)).getTextContent(); text += tc.items.map(i=>i.str).join(' ') + '\n\n'; }
    } else throw new Error('type');
    text = text.trim();
    if(text.length < 20) throw new Error('empty');
    d.text = text; d.fileName = file.name;
  }catch(e){
    d.errors.file = 'Could not read that file. Paste the syllabus text below instead.';
  }
  d.reading = false; render();
}
function validateDraft(){
  const d = S.draft, e = {};
  if(d.text.trim().length < 40) e.text = 'Add your syllabus: upload a file or paste at least a few lines of text.';
  if(!d.level) e.level = 'Choose a level.';
  if(d.level==='Mixed' && LEVELS.indexOf(d.from) >= LEVELS.indexOf(d.to)) e.level = 'The range must start below where it ends.';
  if(!(Number(d.weeks) >= 1)) e.weeks = 'Enter the number of weeks.';
  if(!(Number(d.perWeek) >= 1)) e.perWeek = 'Enter classes per week.';
  if(!(Number(d.len) > 0)) e.len = 'Enter the class length.';
  d.errors = e; return !Object.keys(e).length;
}
function submitCourse(){
  if(!validateDraft()){ render(); const el = document.querySelector('.err'); if(el) el.scrollIntoView({block:'center'}); return; }
  const d = S.draft;
  const c = {
    id: uid(), name: d.fileName ? d.fileName.replace(/\.[^.]+$/,'') : 'New course', createdAt: Date.now(), updatedAt: Date.now(),
    syllabus: d.text.trim(),
    settings: { level: d.level==='Mixed' ? {mode:'mixed', from:d.from, to:d.to} : {mode:'single', level:d.level}, weeks:Number(d.weeks), perWeek:Number(d.perWeek), classMinutes: Math.round(Number(d.len) * (d.lenUnit==='hr'?60:1)), students: d.students ? Number(d.students) : null, english:d.english, extra:d.extra.trim() },
    analysis:null, plan:null, planApproved:false, units:{}
  };
  S.courses.unshift(c); persist(); S.draft = newDraft();
  S.route = {view:'analyze', id:c.id}; render(); runAnalysis(c.id);
}
async function runAnalysis(id){
  const c = S.courses.find(x=>x.id===id); if(!c) return;
  S.analysis = {id, step: c.analysis ? 2 : 1, error:null}; render();
  try{
    if(!c.analysis){
      const a = await AI.analyzeSyllabus(c);
      c.analysis = a; if(a && a.courseTitle) c.name = String(a.courseTitle); touch(c);
      S.analysis.step = 2; render();
    }
    const p = await AI.generateCoursePlan(c);
    c.plan = { weeks: normPlan(p, c) }; c.planApproved = false; touch(c);
    S.analysis = null; go('course', {id, tab:'plan'});
  }catch(e){ if(S.analysis) S.analysis.error = errMsg(e); render(); }
}
async function withBusy(key, fn){
  S.busy[key] = true; S.ui.error=''; render();
  try{ await fn(); }catch(e){ if(e && e.code!=='cancelled') S.ui.error = errMsg(e); }
  finally{ delete S.busy[key]; render(); }
}
function revisePlan(){
  const c = cur(), t = (S.ui.planInstr||'').trim(); if(!t) return;
  withBusy('plan', async () => { const p = await AI.reviseCoursePlan(c, t); const old = c.plan.weeks; const nw = normPlan(p, c); nw.forEach((w,i)=>{ if(old[i] && old[i].title===w.title) w.id = old[i].id; }); c.plan.weeks = nw; c.planApproved = false; S.ui.planInstr=''; touch(c); toast('Plan updated'); });

function approvePlan(){

async function doGenerateWeek(c, i, instruction, signal){
  const w = c.plan.weeks[i]; S.busy['w:'+w.id] = true; render();
  try{
    const r = await AI.generateUnit(c, i, {instruction, signal, onProgress: m => { S.ui.stage = S.ui.stage || {}; S.ui.stage[w.id] = m; render(); }});
    const blocks = (Array.isArray(r) ? r : (r && r.blocks) || []).map(b => normBlock(b));
    if(!blocks.length) throw { message:'No sections came back. Try again.' };
    c.units[w.id] = { blocks, generatedAt: Date.now() }; touch(c);
  } finally { delete S.busy['w:'+w.id]; if(S.ui.stage) delete S.ui.stage[w.id]; render(); }
}
function generateWeek(i){
  const c = cur(), t = ((S.ui.regen||{}).unit||'').trim(); S.ui.error='';
  doGenerateWeek(c, i, t).then(()=>{ S.ui.regen = {}; render(); }).catch(e => { S.ui.error = errMsg(e); render(); });
}
async function generateAll(){
  const c = cur(); if(S.genAll) return;
  const ctrl = new AbortController(); S.genAll = { ctrl }; S.ui.error=''; render();
  for(let i=0;i<c.plan.weeks.length;i++){
    if(ctrl.signal.aborted) break;
    if(hasUnit(c, c.plan.weeks[i].id)) continue;
    S.route.weekIdx = i;
    try{ await doGenerateWeek(c, i, '', ctrl.signal); }
    catch(e){ if(e && e.code!=='cancelled') S.ui.error = `Week ${i+1} stopped: ${errMsg(e)}`; break; }
  }
  S.genAll = null; render();
}
function blockAction(bid, action){
  const c = cur(), i = S.route.weekIdx||0, w = c.plan.weeks[i], u = c.units[w.id];
  const b = u.blocks.find(x=>x.id===bid); if(!b) return;
  const instr = action==='modify' ? ((S.ui.blockInstr||{})[bid]||'').trim() : '';
  if(action==='modify' && !instr) return;
  withBusy('b:'+bid, async () => {
    if(action==='differentiate'){
      const r = await AI.differentiateActivity(c, i, b);
      b.variants = { easier:{student:String(r.easier&&r.easier.student||''), teacher:String(r.easier&&r.easier.teacher||'')}, harder:{student:String(r.harder&&r.harder.student||''), teacher:String(r.harder&&r.harder.teacher||'')} };
      S.ui.variant[bid] = 'core';
    } else {
      const r = normBlock(await AI.reviseActivity(c, i, b, action, instr), b.id);
      Object.assign(b, {kind:r.kind, title:r.title, minutes:r.minutes, student:r.student, teacher:r.teacher, variants:null});
      S.ui.ask[bid] = false; S.ui.blockInstr[bid] = '';
    }
    touch(c);
  });
}

async function saveFile(filename, data, mime){
  const dl = (window.claude && claude.use) ? await claude.use('downloads') : null;
  if(dl){ try{ await dl.save({ filename, data }); }catch(e){ if(e && e.code!=='declined') toast('Could not save the file.'); } return; }
  const url = URL.createObjectURL(new Blob([data], {type:mime}));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
const fileBase = c => (c.name||'course').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-');
async function doExport(kind){
  const c = cur();
  if(kind==='print'){ S.out.preview = true; render(); setTimeout(()=>{ try{ window.print(); }catch(e){ toast('Printing is not available here. Use your browser menu to print.'); } }, 150); return; }
  if(kind==='docx'){ toast('DOCX export is a placeholder in this version. Use Export PDF or Print.'); return; }
  if(kind==='pdf'){
    const N = c.plan.weeks.length;
    const idxs = (S.out.scope==='week' ? [Math.min(S.out.week, N-1)] : c.plan.weeks.map((w,i)=>i)).filter(i => hasUnit(c, c.plan.weeks[i].id));
    if(!idxs.length){ toast('Generate some material first.'); return; }
    S.busy.pdf = true; render();
    try{
      if(!window.PDFLib) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js');
      const doc = { title:c.name, subtitle:'Level '+levelLabel(c), cover: S.out.scope==='workbook',
        weeks: idxs.map(i => ({ heading:`Week ${i+1}: ${c.plan.weeks[i].title}`, blocks: c.units[c.plan.weeks[i].id].blocks.map(b => ({ title:b.title, kind:b.kind, student:b.student, variants:b.variants })) })) };
      const bytes = await buildFillablePdf(PDFLib, doc);
      await saveFile(fileBase(c) + (S.out.scope==='week' ? '-week-'+(idxs[0]+1) : '') + '-fillable.pdf', bytes, 'application/pdf');
      if(S.out.audience==='teacher') toast('Fillable PDFs always use the student version.');
    }catch(e){ toast('Could not build the PDF. Check your connection and try again.'); }
    delete S.busy.pdf; render(); return;
  }
  if(kind==='html'){
    const body = compileOutput(c); if(!body){ toast('Generate some material first.'); return; }
    await saveFile(fileBase(c) + '.html', docStandalone(c, body), 'text/html');
  }
}

async function backupCourses(){
  if(!S.courses.length){ toast('No courses to back up yet.'); return; }
  const name = 'coursewright-backup-' + new Date().toISOString().slice(0,10) + '.json';
  await saveFile(name, JSON.stringify({ app:'coursewright', v:1, courses:S.courses }, null, 1), 'application/json');
}
async function restoreCourses(file){
  try{
    const j = JSON.parse(await file.text());
    const list = Array.isArray(j) ? j : j.courses;
    if(!Array.isArray(list) || !list.every(c => c && c.id && c.settings && typeof c.syllabus === 'string')) throw new Error('bad');
    const map = {}; S.courses.concat(list).forEach(c => { if(!map[c.id] || (c.updatedAt||0) > (map[c.id].updatedAt||0)) map[c.id] = c; });
    S.courses = Object.keys(map).map(k => map[k]).sort((x,y) => (y.updatedAt||0) - (x.updatedAt||0));
    persist(); render(); toast(`Restored. You now have ${S.courses.length} course${S.courses.length===1?'':'s'}.`);
  }catch(e){ toast('That file is not a Coursewright backup.'); }
}

  <p class="hint" style="margin-bottom:20px">${inClaude?'Inside Claude, no setup is needed. The fields below are only used when this page runs on its own.':'This page calls the Claude API directly from your browser. Your key is stored only in this browser.'}</p>
  <div class="card"><div class="field"><label for="k">Claude API key</label><input id="k" type="password" autocomplete="off" data-cfg="key" value="${h(cfg.key||'')}" placeholder="sk-ant-..."><span class="hint">Create one in the Anthropic Console. Use this only on a device you trust, since anyone with access to the browser could read the key.</span></div>

function vAnalyze(){

    return `<div class="proc-row ${done?'done':''} ${now?'now':''}"><span class="dot">${done?ic('check'):now?spinner:''}</span><div><div style="font-weight:600">${label}</div><div class="hint">${sub}</div></div></div>`;
  };
  return `<main class="wrap narrow">${stepper(1)}
    <h1>Analyzing your syllabus\u2026</h1>

function foundHTML(a){
  if(!a) return '';
  const list = (t, v) => (v && v.length) ? `<div><h4>${t}</h4><ul>${v.map(x=>`<li>${h(typeof x==='object' ? (x.label?x.label+': ':'')+(x.topic||'') : x)}</li>`).join('')}</ul></div>` : '';
  return `<details class="found"><summary>${ic('chev')}What the AI found in your syllabus</summary><div class="found-body">
    ${a.courseType||a.description?`<div><h4>Course</h4><p>${h(a.courseType?a.courseType+'. ':'')}${h(a.description||'')}</p></div>`:''}
    ${a.organization?`<div><h4>Organization</h4><p>${h(a.organization)}</p></div>`:''}
    ${list('Objectives',a.objectives)}${list('Main skills',a.skills)}${list('Topics',a.topics)}${list('Language areas',a.languageAreas)}${list('Expected outcomes',a.outcomes)}${list('Assessments',a.assessments)}${list('Weekly topics in the syllabus',a.weeklyTopics)}${list('Worth checking',a.gaps)}
  </div></details>`;
}
function vWorkspace(){

    <div class="ws-head noprint"><input class="name-in" type="text" data-bind-course="name" value="${h(c.name)}" aria-label="Course name">

    <div class="tabs noprint" role="tablist">${tabBtn('plan','1. Plan')}${tabBtn('materials','2. Materials',!c.planApproved)}${tabBtn('output','3. Export',!c.planApproved)}</div>

function vPlan(c){

  return `${stepper(2)}${foundHTML(c.analysis)}

function planCard(c, w, i){

function vMaterials(c){
  const i = Math.min(S.route.weekIdx||0, c.plan.weeks.length-1), w = c.plan.weeks[i];
  const done = genCount(c), N = c.plan.weeks.length, running = !!S.genAll;
  const nav = c.plan.weeks.map((x,k)=>{
    const st = S.busy['w:'+x.id] ? 'busy' : hasUnit(c,x.id) ? 'ready' : '';
    return `<button class="wn" data-a="week" data-i="${k}" aria-current="${k===i}"><span class="st ${st}"></span><span class="t">Week ${k+1}: ${h(x.title)}</span></button>`;
  }).join('');
  return `${stepper(3)}
  <div class="gen-bar noprint">
    ${running?`<button class="btn" data-a="cancel-all">${ic('stop')}Stop generating</button><span class="hint">${spinner} Generating week by week\u2026</span>`
      :`<button class="btn primary" data-a="gen-all" ${done===N?'disabled':''}>${ic('sparkle')}${done===0?'Generate entire course':done===N?'All weeks generated':'Generate remaining weeks'}</button><span class="hint">${done} of ${N} weeks generated. Each week is generated on its own, using the syllabus, your plan and earlier weeks.</span>`}
  </div>
  <div class="mat"><nav class="weeknav noprint" aria-label="Weeks">${nav}</nav><div>${unitEditor(c,i,w)}</div></div>`;

function unitEditor(c, i, w){
  const u = c.units[w.id], busyW = S.busy['w:'+w.id], rg = S.ui.regen || {};
  const head = `<h2>Week ${i+1}: ${h(w.title)}</h2>${w.objectives.length?`<ul class="objs">${w.objectives.map(o=>`<li>${h(o)}</li>`).join('')}</ul>`:''}`;
  const genRow = `<div class="noprint" style="display:grid;gap:8px;margin-top:14px">
      <div class="inline-ask"><input type="text" data-bind="ui.regen.unit" value="${h(rg.unit||'')}" placeholder="Optional: guidance for this week, such as 'more pair work'" aria-label="Guidance for this week"><button class="btn primary" data-a="gen-week" data-i="${i}" ${busyW||S.genAll?'disabled':''}>${busyW?spinner:ic('sparkle')}${u&&u.blocks.length?'Regenerate week':'Generate week'}</button></div></div>`;
  if(!u || !u.blocks.length){
    return `<div class="canvas"><div class="paper">${head}${busyW?`<p class="hint" style="margin-top:16px">${spinner} ${h((S.ui.stage||{})[w.id] || 'Writing this week\u2026 long weeks can take a few minutes.')}</p>`:`<p class="hint" style="margin-top:16px">Nothing generated for this week yet.</p>`}${genRow}

  return `<div class="canvas"><div class="paper">${head}
    <div class="meta" style="margin-top:10px"><span class="tag gold">${total} of ${w.minutes} min planned</span><span class="tag">${u.blocks.length} sections</span></div>
    <div class="noprint" style="margin-top:12px"><label style="display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer"><input type="checkbox" data-a="toggle-notes" ${S.ui.notes?'checked':''}> Show teacher notes and answers</label></div>
    ${genRow}
    ${busyW?`<p class="hint" style="margin-top:10px">${spinner} ${h((S.ui.stage||{})[w.id] || 'Regenerating this week\u2026')}</p>`:''}
    ${u.blocks.map(b=>blockView(c,b)).join('')}
    <div class="noprint" style="margin-top:20px"><button class="btn sm" data-a="add-block">${ic('plus')}Add section</button></div>
  </div></div>`;
};
function blockView(c, b){

/* ---------- render + events ---------- */
function render(){
  const y = window.scrollY, ae = document.activeElement, focusBind = ae && ae.getAttribute && ae.getAttribute('data-bind');
  const v = S.route.view;
  const page = v==='dashboard' ? vDashboard() : v==='create' ? vCreate() : v==='analyze' ? vAnalyze() : v==='settings' ? vSettings() : vWorkspace();
  document.getElementById('app').innerHTML = topbar() + page;
  window.scrollTo(0, y);
  if(focusBind){ const el = document.querySelector(`[data-bind="${focusBind}"]`); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} } }
}
document.addEventListener('input', e => {
  const t = e.target; const b = t.getAttribute && t.getAttribute('data-bind');
  if(b){ setPath(S, b, t.value); if(b==='draft.text' && S.draft.errors.text && t.value.trim().length>=40){ S.draft.errors.text=''; } }
  const cf = t.getAttribute && t.getAttribute('data-cfg');
  if(cf){ let o = {}; try{ o = JSON.parse(localStorage.getItem('coursewright-ai')) || {}; }catch(e){} o[cf] = t.value.trim(); try{ localStorage.setItem('coursewright-ai', JSON.stringify(o)); }catch(e){} }
  const bc = t.getAttribute && t.getAttribute('data-bind-course');
  if(bc){ const c = cur(); if(c){ c[bc] = t.value; touch(c); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='file' && t.files && t.files[0]){ readFile(t.files[0]); return; }
  if(t.id==='restore' && t.files && t.files[0]){ restoreCourses(t.files[0]); return; }
  const b = t.getAttribute && t.getAttribute('data-bind');
  if(b){ setPath(S, b, t.dataset.num ? Number(t.value) : t.value); if(b==='out.week') { render(); } }
  if(t.getAttribute && t.getAttribute('data-a')==='toggle-notes'){ S.ui.notes = t.checked; render(); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el || el.tagName==='INPUT') return;
  const a = el.dataset.a, id = el.dataset.id, i = el.dataset.i!=null ? Number(el.dataset.i) : null, v = el.dataset.v;
  const c = cur();
  switch(a){
    case 'home': S.analysis = S.route.view==='analyze' ? S.analysis : null; go('dashboard'); break;
    case 'settings': go('settings'); break;
    case 'backup': backupCourses(); break;
    case 'restore-pick': document.getElementById('restore').click(); break;
    case 'new': S.draft = S.draft || newDraft(); go('create'); break;
    case 'open': { const x = S.courses.find(k=>k.id===id); if(!x) break; if(!x.plan){ S.route={view:'analyze',id}; render(); runAnalysis(id); } else go('course',{id, tab: x.planApproved && genCount(x)? 'materials':'plan', weekIdx:0}); break; }
    case 'delcourse': deleteCourse(id); break;
    case 'pick': document.getElementById('file').click(); break;
    case 'level': S.draft.level = v; S.draft.errors.level=''; render(); break;
    case 'english': S.draft.english = v; render(); break;
    case 'submit': submitCourse(); break;
    case 'retry-analysis': runAnalysis(S.route.id); break;
    case 'tab': S.route.tab = v; S.ui.error=''; S.ui.blockEdit=null; render(); window.scrollTo(0,0); break;
    case 'example': S.ui.planInstr = v; render(); break;
    case 'revise-plan': revisePlan(); break;
    case 'edit-week': S.ui.edit = editFor(c.plan.weeks[i]); render(); break;
    case 'save-edit': savePlanEdit(); break;
    case 'cancel-edit': S.ui.edit = null; render(); break;
    case 'add-week': addWeek(); break;
    case 'remove-week': removeWeek(i); break;
    case 'regen-open': S.ui.regen = { open:id, text:'' }; render(); break;
    case 'regen-go': regenPlanWeek(i); break;
    case 'approve': approvePlan(); break;
    case 'week': S.route.weekIdx = i; S.ui.blockEdit=null; render(); break;
    case 'gen-all': generateAll(); break;
    case 'cancel-all': if(S.genAll) S.genAll.ctrl.abort(); toast('Stopping after the current week finishes'); break;
    case 'gen-week': generateWeek(i); break;
    case 'add-block': addBlock(); break;
    case 'variant': S.ui.variant[id] = v; render(); break;
    case 'b-edit': { const w = c.plan.weeks[S.route.weekIdx||0], b = c.units[w.id].blocks.find(x=>x.id===id); S.ui.blockEdit = { id, kind:b.kind, title:b.title, minutes:String(b.minutes||''), student:b.student, teacher:b.teacher }; render(); break; }
    case 'save-block': saveBlockEdit(); break;
    case 'cancel-block': S.ui.blockEdit = null; render(); break;
    case 'b-regenerate': blockAction(id,'regenerate'); break;
    case 'b-easier': blockAction(id,'easier'); break;
    case 'b-harder': blockAction(id,'harder'); break;
    case 'b-expand': blockAction(id,'expand'); break;
    case 'b-shorten': blockAction(id,'shorten'); break;
    case 'b-ask': S.ui.ask[id] = !S.ui.ask[id]; render(); break;
    case 'b-modify': blockAction(id,'modify'); break;
    case 'b-diff': blockAction(id,'differentiate'); break;
    case 'b-delete': deleteBlock(id); break;
    case 'out-aud': S.out.audience = v; render(); break;
    case 'out-scope': S.out.scope = v; render(); break;
    case 'out-preview': S.out.preview = true; render(); break;
    case 'out-print': doExport('print'); break;
    case 'out-pdf': doExport('pdf'); break;
    case 'out-docx': doExport('docx'); break;
    case 'out-html': doExport('html'); break;
  }
});

loadState();
render();
</script>
</body>
</html>
